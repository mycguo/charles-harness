# Install only after building /opt/charles-harness and pausing all Sources.
# The base unit retains the existing Linux account, private env files and stop policy.
[Service]
WorkingDirectory=/opt/charles-harness
ExecStart=
ExecStart=/usr/local/bin/pnpm dsh --profile superagent --host 127.0.0.1 --port 3082 --no-open
